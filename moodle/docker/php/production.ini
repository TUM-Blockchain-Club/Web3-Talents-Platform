; Loaded after moodle-dev.ini by the production Compose overlay.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
expose_php = Off

; Allow session recordings up to 1 GiB, with room for multipart form overhead.
upload_max_filesize = 1024M
post_max_size = 1100M
